<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a8ec5"/>
      <stop offset="100%" stop-color="#9ba8d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#e6c55a"/>
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>

  <!-- Elegant "S" letter for NOKORU -->
  <path d="M11 11.5C11 9.5 13 8 16 8C19 8 21 9.5 21 11.5C21 13.5 19 14.5 16 15.5C13 16.5 11 17.5 11 19.5C11 21.5 13 23 16 23C19 23 21 21.5 21 19.5"
        stroke="white"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"/>

  <!-- Small decorative dot -->
  <circle cx="23" cy="9" r="2" fill="url(#gold)"/>
</svg>
